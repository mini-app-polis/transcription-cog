[project]
name = "transcription-cog"
dynamic = ["version"]
description = "Prefect pipeline cog. Two pipelines under one deployment: WCS lesson transcripts → Postgres, and voicenotes (Drive → Whisper → Claude → Asana)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "miniapppolis-common-utils[llm]>=5.8.0,<6",
    "prefect>=3.0.0,<4.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "sentry-sdk>=2.0.0,<3.0.0",
    # voicenotes sub-pipeline (merged from voicenotes-cog, May 2026)
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/transcription_cog/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription_cog"]

# Hatch ships non-Python files inside the package tree by default, but the
# voicenotes extraction prompt is load-bearing — it's read at runtime by
# transcription_cog.voicenotes.clients.claude_client via importlib.resources.
# Pin it explicitly so the wheel can't accidentally drop it if hatch's
# default-include rules change.
[tool.hatch.build.targets.wheel.force-include]
"src/transcription_cog/voicenotes/prompts/extract.md" = "transcription_cog/voicenotes/prompts/extract.md"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["transcription_cog"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=transcription_cog --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "transcription_cog.main"
disable_error_code = ["arg-type"]
