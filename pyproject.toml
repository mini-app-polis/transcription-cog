[project]
name = "notes-ingest-cog"
version = "0.1.0"
description = "Prefect pipeline cog. Two pipelines under one deployment: WCS lesson transcripts → Postgres, and voicenotes (Drive → Whisper → Claude → Todoist)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "common-python-utils[llm]",
    "prefect>=3.0.0,<4.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "sentry-sdk>=2.0.0,<3.0.0",
    # voicenotes sub-pipeline (merged from voicenotes-cog, May 2026)
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
]

[tool.uv.sources]
common-python-utils = { git = "https://github.com/mini-app-polis/common-python-utils.git", rev = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_ingest_cog"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["notes_ingest_cog"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=notes_ingest_cog --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "notes_ingest_cog.main"
disable_error_code = ["arg-type"]
