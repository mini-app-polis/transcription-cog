name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src/
      - name: Run tests
        # The voicenotes sub-pipeline imports a pydantic-settings ``Settings``
        # model at module import time (see voicenotes/config.py). Tests seed
        # defaults in tests/voicenotes/conftest.py via os.environ.setdefault
        # before any voicenotes module loads, but seeding them here as well
        # is defense-in-depth against import-order changes. No real secrets:
        # tests use mocks, respx, and the in-memory Prefect harness.
        env:
          OPENAI_API_KEY: test
          ANTHROPIC_API_KEY: test
          TODOIST_API_TOKEN: test
          TODOIST_INBOX_PROJECT_ID: test
          GOOGLE_DRIVE_VOICE_INBOX_FOLDER_ID: test
        run: uv run pytest --cov=transcription_cog --cov-report=term-missing

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install semantic-release plugins
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release