# transcription-cog / evaluator.yaml
# Per-repo evaluation configuration — ecosystem-standards ADR-001, ADR-002

type: pipeline-cog

deferrals:
  - rule: PY-013
    reason: >
      possible_duplicate_ prefixing is an archival-preservation pattern for
      file-level deduplication. transcription-cog does row-level dedup in
      api-kaianolevine-com, which keeps one transcript per owner and Drive file
      and treats a duplicate POST to /v1/wcs/transcripts as a re-ingestion rather
      than an error — the raw file still archives normally on success. No
      duplicate file exists to prefix. Tracked as a standards-side split of
      PY-013 into file-level vs row-level patterns.
    until: null

# TEST-001/002/004 were excepted in ecosystem.yaml but pipeline-cog type
# scoping now covers these automatically — no exemptions needed.

exemptions:
  # The exemption below was carried over from voicenotes-cog when it was
  # merged into this repo (ADR-004). It scopes to the
  # ``src/transcription_cog/voicenotes/`` sub-package only.

  - rule: CD-009
    reason: >
      ``src/transcription_cog/voicenotes/_shared.py`` is the sub-package's
      bridge to the shared ``mini_app_polis`` (common-python-utils) logger.
      It cannot itself import from the shared logger because it IS the
      import-time adapter — defining the ``StructuredLogger`` Protocol
      that voicenotes code calls and the ``_UpstreamLoggerAdapter`` that
      wraps upstream's stdlib logger to emit CD-009-shaped JSON events.
      All voicenotes code OUTSIDE
      ``_shared.py`` consumes the shared logger through ``get_logger()``;
      the hand-rolled logging code is contained to this single bridge
      module.

  - rule: XSTACK-005
    reason: >
      Scoped to ``src/transcription_cog/voicenotes/clients/``. Of the three
      clients there, one already goes through common-python-utils:
      ``drive_client.py`` wraps ``mini_app_polis.google.GoogleAPI`` (via
      ``_shared.get_google_api``) and adds only structured logging.
      ``whisper_client.py`` calls OpenAI's audio transcription endpoint,
      which the shared library has no facade for. ``claude_client.py`` is
      the one client that bypasses a shared facade (``LLMClient``), and it
      does so because the voicenotes path runs inside a single Lambda
      invocation budget (voicenotes/config.py) that ``build_llm`` cannot
      express today: it does not expose ``max_tokens`` (extraction is
      capped at 512), it has no ceiling on the SDK's retry-after wait
      (``_CappedRetryWaitAnthropic``), and ``LLMResult`` carries no token
      usage, which the per-note cost logging reads. The client's
      parse-retry-then-fallback path (the lost-note guarantee) also needs
      the raw response text on a parse failure, which ``generate_json``
      raises away. Revisit when the shared ``LLMClient`` exposes
      ``max_tokens``, a retry-wait cap and token usage; at that point the
      extraction call moves onto it and this exemption narrows to Whisper.

  # NB: voicenotes-cog also held a CD-010 (Healthchecks.io ping) exemption.
  # It does not apply here. On Lambda, CD-010's liveness layer is the
  # dead-letter-queue alarm with an action, declared in mini-app-polis/infra
  # (ADR-009 in ecosystem-standards; ADR-007 here).
