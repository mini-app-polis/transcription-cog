# notes-ingest-cog / evaluator.yaml
# Per-repo evaluation configuration — ecosystem-standards ADR-001, ADR-002

type: pipeline-cog

deferrals:
  - rule: PY-013
    reason: >
      possible_duplicate_ prefixing is an archival-preservation pattern for
      duplicate file handling. notes-ingest-cog currently relies on the
      uq_wcs_transcripts_drive_file_id unique constraint in api-kaianolevine-com
      and skips (without moving) on conflict. Prefixing is a planned enhancement
      tracked in ADR-0002. Not blocking.
    until: null

  - rule: CD-012
    reason: >
      Replace X-Internal-API-Key with Clerk M2M JWT. This is Project Keystone —
      the ecosystem-wide auth migration coordinated across all cogs and
      api-kaianolevine-com. Current state: Phase 1 (legacy only). Will be
      resolved atomically across the ecosystem when Keystone ships.
      See api-kaianolevine-com migration 013 for phase tracking.
    until: null

# TEST-001/002/004 were excepted in ecosystem.yaml but pipeline-cog type
# scoping now covers these automatically — no exemptions needed.
