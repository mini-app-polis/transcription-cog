# transcription-cog / evaluator.yaml
# Per-repo evaluation configuration — ecosystem-standards ADR-001, ADR-002

type: pipeline-cog

deferrals:
  - rule: PY-013
    reason: >
      possible_duplicate_ prefixing is an archival-preservation pattern for
      file-level deduplication. transcription-cog does row-level dedup via the
      uq_wcs_transcripts_drive_file_id unique constraint in api-kaianolevine-com
      and skips (without renaming) on conflict — the raw file still archives
      normally on success. No duplicate file exists to prefix. Tracked as a
      standards-side split of PY-013 into file-level vs row-level patterns.
    until: null

# TEST-001/002/004 were excepted in ecosystem.yaml but pipeline-cog type
# scoping now covers these automatically — no exemptions needed.

exemptions:
  # The two exemptions below were carried over from voicenotes-cog when it
  # was merged into this repo (May 2026, ADR-004). They scope to the
  # ``src/transcription_cog/voicenotes/`` sub-package only.

  - rule: CD-003
    reason: >
      The two flagged print() sites inside src/transcription_cog/voicenotes/
      are intentional and not candidates for the structured logger:

      1. src/transcription_cog/voicenotes/scripts/setup_todoist.py — a
         one-time interactive operator-facing CLI script. The print() calls
         render the Doppler-bound output the operator needs to copy/paste;
         they are the script's user interface, not telemetry. Routing
         through the structured logger would emit JSON to stderr instead
         of human-readable terminal output.
      2. src/transcription_cog/voicenotes/_shared.py — the FallbackLogger's
         _emit method. By design this is the local fallback when
         common-python-utils is not importable; emitting JSON lines to
         stderr via print() is its entire purpose. The site is gated by
         the same RuntimeWarning that fires on first fallback use, so it
         can never silently mask a real logging path.

  - rule: CD-009
    reason: >
      ``src/transcription_cog/voicenotes/_shared.py`` is the sub-package's
      bridge to the shared ``mini_app_polis`` (common-python-utils) logger.
      It cannot itself import from the shared logger because it IS the
      import-time adapter — defining the ``StructuredLogger`` Protocol
      that voicenotes code calls, the ``_UpstreamLoggerAdapter`` that wraps
      upstream's stdlib logger to emit CD-009-shaped JSON events, and the
      ``_FallbackLogger`` that emits to stderr when upstream is not
      importable (so tests can run on machines without the shared library
      installed). Structurally analogous to watcher-cog's
      ``logger-primitive`` trait. All voicenotes code OUTSIDE
      ``_shared.py`` consumes the shared logger through ``get_logger()``;
      the hand-rolled logging code is contained to this single bridge
      module.

  # NB: voicenotes-cog also held a CD-010 (Healthchecks.io ping) exemption.
  # That exemption no longer applies in this repo — main.py:124-132 pings
  # Healthchecks.io on startup, so the dead-man's switch is in place.
